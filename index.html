<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropScrape CRM - Rental Property Sourcing</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function Icon({ name, className = "w-4 h-4" }) {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            root: iconRef.current
          });
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    const INITIAL_PROPERTIES = [
      {
        id: 'prop-101',
        title: 'Modern 2 Bed Apartment with River Views',
        address: '14 Wharfside Quay',
        location: 'Grays',
        postcode: 'RM17 6BZ',
        rent: 1450,
        bedrooms: 2,
        propertyType: 'Flats',
        contactName: 'David Miller',
        phone: '+44 7700 900123',
        email: 'david.miller@propertygroup.co.uk',
        contactType: 'Landlord',
        dateScraped: '2026-03-12',
        status: 'In Discussion',
        source: 'Web Scraper',
        notes: 'Landlord open to long-term corporate lease.',
        assignedTo: 'Alex Morgan',
        lastContactedBy: {
          name: 'Alex Morgan',
          timestamp: '2026-03-13 14:30',
          actionType: 'Phone Call'
        }
      },
      {
        id: 'prop-102',
        title: 'Spacious 4 Bed HMO / Shared House',
        address: '88 High Street',
        location: 'Manchester',
        postcode: 'M4 1HQ',
        rent: 2200,
        bedrooms: 4,
        propertyType: 'HMOs',
        contactName: 'Sarah Jenkins (Apex Lettings)',
        phone: '+44 7700 900456',
        email: 's.jenkins@apexlettings.com',
        contactType: 'Agent',
        dateScraped: '2026-03-14',
        status: 'New Lead',
        source: 'Web Scraper',
        notes: 'Fully furnished, ideal for professional shared living.',
        assignedTo: 'David Chen',
        lastContactedBy: {
          name: 'David Chen',
          timestamp: '2026-03-14 11:20',
          actionType: 'Email'
        }
      },
      {
        id: 'prop-103',
        title: '3 Bedroom Semi-Detached Family Home',
        address: '42 Kensington Gardens',
        location: 'London',
        postcode: 'W8 4PE',
        rent: 3100,
        bedrooms: 3,
        propertyType: 'Houses',
        contactName: 'Marcus Vance',
        phone: '+44 7700 900789',
        email: 'marcus.vance@vancemail.co.uk',
        contactType: 'Landlord',
        dateScraped: '2026-03-10',
        status: 'Attempted Contact',
        source: 'Rightmove',
        notes: 'Left voicemail on 15th March.',
        assignedTo: 'Sarah Connor',
        lastContactedBy: {
          name: 'Sarah Connor',
          timestamp: '2026-03-15 16:45',
          actionType: 'Voicemail'
        }
      },
      {
        id: 'prop-104',
        title: '5 Bed Executive Detached House',
        address: '12 Thames Promenade',
        location: 'Grays',
        postcode: 'RM17 5AZ',
        rent: 2800,
        bedrooms: 5,
        propertyType: 'Houses',
        contactName: 'Robert Sterling',
        phone: '+44 7700 900654',
        email: 'rsterling@sterlingestates.com',
        contactType: 'Agent',
        dateScraped: '2026-03-01',
        status: 'Deal Secured',
        source: 'Direct Lead',
        notes: 'Contract signed! 3-year Guaranteed Rent agreed.',
        assignedTo: 'Alex Morgan',
        lastContactedBy: {
          name: 'Alex Morgan',
          timestamp: '2026-03-12 16:00',
          actionType: 'Contract Signed'
        }
      }
    ];

    const PIPELINE_STAGES = [
      'New Lead',
      'Attempted Contact',
      'In Discussion',
      'Viewing Scheduled',
      'Deal Secured',
      'Cold/Archived'
    ];

    function App() {
      const [properties, setProperties] = useState(() => {
        const saved = localStorage.getItem('propscrape_crm_leads');
        return saved ? JSON.parse(saved) : INITIAL_PROPERTIES;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem('propscrape_current_user') || 'Alex Morgan';
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStage, setSelectedStage] = useState('ALL');
      const [selectedLocation, setSelectedLocation] = useState('ALL');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedProp, setSelectedProp] = useState(null);

      const [newLead, setNewLead] = useState({
        title: '', address: '', location: 'Grays', postcode: 'RM17',
        rent: 1600, bedrooms: 2, propertyType: 'Flats',
        contactName: '', phone: '', email: '', contactType: 'Landlord'
      });

      useEffect(() => {
        localStorage.setItem('propscrape_crm_leads', JSON.stringify(properties));
      }, [properties]);

      const filtered = useMemo(() => {
        return properties.filter(p => {
          const q = searchQuery.toLowerCase();
          const matchSearch = (p.title || '').toLowerCase().includes(q) ||
            (p.address || '').toLowerCase().includes(q) ||
            (p.postcode || '').toLowerCase().includes(q) ||
            (p.location || '').toLowerCase().includes(q) ||
            (p.contactName || '').toLowerCase().includes(q);
          const matchStage = selectedStage === 'ALL' || p.status === selectedStage;
          const matchLoc = selectedLocation === 'ALL' || p.location === selectedLocation;
          return matchSearch && matchStage && matchLoc;
        });
      }, [properties, searchQuery, selectedStage, selectedLocation]);

      const locations = useMemo(() => {
        return Array.from(new Set(properties.map(p => p.location).filter(Boolean)));
      }, [properties]);

      const handleUpdateStatus = (id, newStatus) => {
        const time = new Date().toISOString().slice(0, 16).replace('T', ' ');
        setProperties(prev => prev.map(p => {
          if (p.id === id) {
            return {
              ...p,
              status: newStatus,
              lastContactedBy: {
                name: currentUser,
                timestamp: time,
                actionType: 'Status Change'
              }
            };
          }
          return p;
        }));
      };

      const handleAddLeadSubmit = (e) => {
        e.preventDefault();
        const id = 'prop-' + Date.now().toString().slice(-4);
        const time = new Date().toISOString().slice(0, 16).replace('T', ' ');
        const item = {
          ...newLead,
          id,
          dateScraped: time.split(' ')[0],
          status: 'New Lead',
          source: 'Manual Input',
          assignedTo: currentUser,
          lastContactedBy: {
            name: currentUser,
            timestamp: time,
            actionType: 'Created'
          }
        };
        setProperties([item, ...properties]);
        setIsAddModalOpen(false);
      };

      const exportCSV = () => {
        const headers = ['ID', 'Title', 'Address', 'Town', 'Postcode', 'Rent', 'Bedrooms', 'Contact', 'Phone', 'Status', 'Last Contacted By', 'Last Contact Date'];
        const rows = filtered.map(p => [
          `"${p.id}"`,
          `"${p.title.replace(/"/g, '""')}"`,
          `"${p.address.replace(/"/g, '""')}"`,
          `"${p.location}"`,
          `"${p.postcode || ''}"`,
          p.rent,
          p.bedrooms,
          `"${p.contactName.replace(/"/g, '""')}"`,
          `"${p.phone}"`,
          `"${p.status}"`,
          `"${p.lastContactedBy?.name || ''}"`,
          `"${p.lastContactedBy?.timestamp || ''}"`
        ]);
        const csvContent = [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `propscrape_leads_${filtered.length}.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-20 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-indigo-600 p-2 rounded-xl text-white">
                  <Icon name="building-2" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    PropScrape CRM
                  </h1>
                  <p className="text-[10px] text-slate-400">Rental Sourcing & Lead Management</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs">
                  <span className="text-slate-400">User:</span>
                  <select 
                    value={currentUser} 
                    onChange={(e) => {
                      setCurrentUser(e.target.value);
                      localStorage.setItem('propscrape_current_user', e.target.value);
                    }}
                    className="bg-transparent font-semibold text-slate-200 focus:outline-none"
                  >
                    <option value="Alex Morgan" className="bg-slate-900">Alex Morgan</option>
                    <option value="David Chen" className="bg-slate-900">David Chen</option>
                    <option value="Sarah Connor" className="bg-slate-900">Sarah Connor</option>
                  </select>
                </div>

                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-md transition"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>Add Lead</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                <div className="text-xs text-slate-400">Total Leads</div>
                <div className="text-2xl font-bold mt-1">{properties.length}</div>
              </div>
              <div className="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                <div className="text-xs text-slate-400">Contacted</div>
                <div className="text-2xl font-bold text-cyan-400 mt-1">
                  {properties.filter(p => p.status !== 'New Lead').length}
                </div>
              </div>
              <div className="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                <div className="text-xs text-slate-400">Total Rent Ask</div>
                <div className="text-2xl font-bold text-amber-400 mt-1">
                  £{properties.reduce((s, p) => s + Number(p.rent || 0), 0).toLocaleString()}
                </div>
              </div>
              <div className="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                <div className="text-xs text-slate-400">Deals Secured</div>
                <div className="text-2xl font-bold text-emerald-400 mt-1">
                  {properties.filter(p => p.status === 'Deal Secured').length}
                </div>
              </div>
            </div>

            <div className="bg-slate-800/80 border border-slate-700 p-4 rounded-2xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
              <div className="relative flex-1">
                <input
                  type="text"
                  placeholder="Search postcode (e.g. RM17, M4), address, town or landlord..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <select
                  value={selectedLocation}
                  onChange={(e) => setSelectedLocation(e.target.value)}
                  className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2"
                >
                  <option value="ALL">All Towns</option>
                  {locations.map(loc => (
                    <option key={loc} value={loc}>{loc}</option>
                  ))}
                </select>

                <select
                  value={selectedStage}
                  onChange={(e) => setSelectedStage(e.target.value)}
                  className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2"
                >
                  <option value="ALL">All Stages</option>
                  {PIPELINE_STAGES.map(s => (
                    <option key={s} value={s}>{s}</option>
                  ))}
                </select>

                <button
                  onClick={exportCSV}
                  className="flex items-center gap-1.5 px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-semibold"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>Export ({filtered.length})</span>
                </button>
              </div>
            </div>

            <div className="bg-slate-800/60 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-300">
                  <thead className="bg-slate-900/90 text-xs text-slate-400 uppercase tracking-wider border-b border-slate-700">
                    <tr>
                      <th className="p-4">Property & Postcode</th>
                      <th className="p-4">Rent / Beds</th>
                      <th className="p-4">Landlord / Phone</th>
                      <th className="p-4">Last Contacted By</th>
                      <th className="p-4">Status</th>
                      <th className="p-4 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/60">
                    {filtered.length === 0 ? (
                      <tr>
                        <td colSpan={6} className="p-8 text-center text-slate-500">
                          No property leads match your criteria.
                        </td>
                      </tr>
                    ) : (
                      filtered.map(p => (
                        <tr key={p.id} className="hover:bg-slate-700/30 transition">
                          <td className="p-4">
                            <div className="font-semibold text-slate-100">{p.title}</div>
                            <div className="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                              <span>{p.address}, {p.location}</span>
                              {p.postcode && (
                                <span className="bg-slate-900 px-1.5 py-0.5 rounded text-[10px] text-cyan-300 font-mono border border-slate-700">
                                  {p.postcode}
                                </span>
                              )}
                            </div>
                          </td>
                          <td className="p-4 whitespace-nowrap">
                            <div className="text-slate-100 font-medium">£{p.rent} / mo</div>
                            <div className="text-xs text-slate-400">{p.bedrooms} Bed ({p.propertyType})</div>
                          </td>
                          <td className="p-4 whitespace-nowrap">
                            <div className="font-medium text-slate-200">{p.contactName}</div>
                            <div className="text-xs text-slate-400">{p.phone}</div>
                          </td>
                          <td className="p-4 whitespace-nowrap">
                            {p.lastContactedBy ? (
                              <div>
                                <div className="text-xs font-medium text-slate-200 flex items-center gap-1.5">
                                  <span className="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
                                  {p.lastContactedBy.name}
                                </div>
                                <div className="text-[10px] text-slate-400">
                                  {p.lastContactedBy.actionType} • {p.lastContactedBy.timestamp.split(' ')[0]}
                                </div>
                              </div>
                            ) : (
                              <span className="text-xs text-slate-500 italic">None</span>
                            )}
                          </td>
                          <td className="p-4 whitespace-nowrap">
                            <select
                              value={p.status}
                              onChange={(e) => handleUpdateStatus(p.id, e.target.value)}
                              className="text-xs font-semibold px-2.5 py-1 rounded-full border border-slate-700 bg-slate-900 cursor-pointer focus:outline-none"
                            >
                              {PIPELINE_STAGES.map(s => (
                                <option key={s} value={s}>{s}</option>
                              ))}
                            </select>
                          </td>
                          <td className="p-4 whitespace-nowrap text-right">
                            <button
                              onClick={() => setSelectedProp(p)}
                              className="px-3 py-1 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 rounded-lg text-xs"
                            >
                              Details
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {isAddModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <h3 className="font-bold text-slate-100">Add New Rental Lead</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <form onSubmit={handleAddLeadSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Property Title</label>
                    <input
                      required
                      type="text"
                      placeholder="e.g. 2 Bed Modern Flat near Station"
                      value={newLead.title}
                      onChange={e => setNewLead({ ...newLead, title: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Town / Area</label>
                      <input
                        required
                        type="text"
                        value={newLead.location}
                        onChange={e => setNewLead({ ...newLead, location: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Postcode / Outcode</label>
                      <input
                        required
                        type="text"
                        placeholder="e.g. RM17 6BZ"
                        value={newLead.postcode}
                        onChange={e => setNewLead({ ...newLead, postcode: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Address</label>
                    <input
                      required
                      type="text"
                      placeholder="e.g. 15 High Street"
                      value={newLead.address}
                      onChange={e => setNewLead({ ...newLead, address: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Rent (£ PCM)</label>
                      <input
                        required
                        type="number"
                        value={newLead.rent}
                        onChange={e => setNewLead({ ...newLead, rent: Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Bedrooms</label>
                      <input
                        required
                        type="number"
                        value={newLead.bedrooms}
                        onChange={e => setNewLead({ ...newLead, bedrooms: Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Landlord / Contact Name</label>
                      <input
                        required
                        type="text"
                        value={newLead.contactName}
                        onChange={e => setNewLead({ ...newLead, contactName: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Phone Number</label>
                      <input
                        required
                        type="text"
                        value={newLead.phone}
                        onChange={e => setNewLead({ ...newLead, phone: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                  </div>
                  <div className="pt-3 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-slate-200"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-semibold"
                    >
                      Save Lead
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedProp && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-start pb-2 border-b border-slate-700">
                  <div>
                    <h3 className="font-bold text-slate-100 text-base">{selectedProp.title}</h3>
                    <p className="text-xs text-slate-400">{selectedProp.address}, {selectedProp.location} ({selectedProp.postcode})</p>
                  </div>
                  <button onClick={() => setSelectedProp(null)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <div className="bg-slate-900 p-3 rounded-xl text-xs space-y-1">
                  <div><span className="text-slate-400">Rent:</span> <span className="font-bold text-indigo-300">£{selectedProp.rent} / month</span></div>
                  <div><span className="text-slate-400">Bedrooms:</span> {selectedProp.bedrooms} Bed ({selectedProp.propertyType})</div>
                  <div><span className="text-slate-400">Contact:</span> {selectedProp.contactName} ({selectedProp.phone})</div>
                  <div><span className="text-slate-400">Assigned To:</span> {selectedProp.assignedTo || 'Unassigned'}</div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setSelectedProp(null)} className="px-4 py-2 bg-slate-700 rounded-xl text-xs text-slate-200">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
