<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Property Sourcing CRM</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_LEADS = [
      {
        id: '1',
        title: '3 Bed Terraced House - High Street',
        location: 'Grays, RM17',
        postcode: 'RM17',
        price: 1650,
        bedrooms: 3,
        propertyType: 'House',
        contactName: 'David Miller',
        phone: '07700 900123',
        email: 'd.miller@example.com',
        status: 'New Lead',
        engagedBy: 'Alex (Sourcing Manager)',
        notes: 'Motivated landlord looking for long term tenant.',
        history: [{ date: '2026-10-15 10:30', text: 'Added by Alex' }]
      },
      {
        id: '2',
        title: '2 Bed Modern Apartment - Riverside',
        location: 'Grays, RM17',
        postcode: 'RM17',
        price: 1350,
        bedrooms: 2,
        propertyType: 'Flat',
        contactName: 'Sarah Jenkins',
        phone: '07700 900456',
        email: 's.jenkins@example.com',
        status: 'Contacted',
        engagedBy: 'Sarah (Negotiator)',
        notes: 'Sent proposal email.',
        history: [{ date: '2026-10-14 09:15', text: 'Contacted by Sarah' }]
      }
    ];

    const TEAM_USERS = [
      'Alex (Sourcing Manager)',
      'Sarah (Negotiator)',
      'Jordan (Director)',
      'Marcus (Acquisitions)'
    ];

    function App() {
      const [leads, setLeads] = useState(() => {
        const saved = localStorage.getItem('property_crm_leads_v2');
        return saved ? JSON.parse(saved) : INITIAL_LEADS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem('property_crm_user_v2') || TEAM_USERS[0];
      });

      const [activeTab, setActiveTab] = useState('crm');
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [bedroomFilter, setBedroomFilter] = useState('All');
      const [postcodeFilter, setPostcodeFilter] = useState('All');
      const [selectedLead, setSelectedLead] = useState(null);
      const [newNote, setNewNote] = useState('');

      useEffect(() => {
        localStorage.setItem('property_crm_leads_v2', JSON.stringify(leads));
      }, [leads]);

      useEffect(() => {
        localStorage.setItem('property_crm_user_v2', currentUser);
      }, [currentUser]);

      const postcodes = ['All', ...new Set(leads.map(l => l.postcode))];

      const filteredLeads = leads.filter(l => {
        const matchesSearch = l.title.toLowerCase().includes(searchTerm.toLowerCase()) || l.contactName.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesStatus = statusFilter === 'All' || l.status === statusFilter;
        const matchesBeds = bedroomFilter === 'All' || String(l.bedrooms) === bedroomFilter;
        const matchesPc = postcodeFilter === 'All' || l.postcode === postcodeFilter;
        return matchesSearch && matchesStatus && matchesBeds && matchesPc;
      });

      const updateStatus = (id, newStatus) => {
        setLeads(leads.map(l => {
          if (l.id === id) {
            return {
              ...l,
              status: newStatus,
              engagedBy: currentUser,
              history: [...l.history, { date: new Date().toLocaleString(), text: `Status changed to ${newStatus} by ${currentUser}` }]
            };
          }
          return l;
        }));
        if (selectedLead && selectedLead.id === id) {
          setSelectedLead(prev => ({ ...prev, status: newStatus, engagedBy: currentUser }));
        }
      };

      const addNote = () => {
        if (!newNote.trim() || !selectedLead) return;
        const entry = { date: new Date().toLocaleString(), text: `${newNote} (by ${currentUser})` };
        setLeads(leads.map(l => {
          if (l.id === selectedLead.id) {
            return { ...l, engagedBy: currentUser, history: [...l.history, entry] };
          }
          return l;
        }));
        setSelectedLead(prev => ({ ...prev, engagedBy: currentUser, history: [...prev.history, entry] }));
        setNewNote('');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
            <div className="flex items-center space-x-3">
              <span className="bg-indigo-600 px-3 py-1.5 rounded font-bold text-lg">RCRM</span>
              <h1 className="font-bold text-lg">Rental Property Sourcing CRM</h1>
            </div>
            <div className="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
              <span className="text-xs text-slate-400">User:</span>
              <select
                value={currentUser}
                onChange={e => setCurrentUser(e.target.value)}
                className="bg-transparent text-xs text-white font-bold outline-none cursor-pointer"
              >
                {TEAM_USERS.map(u => <option key={u} value={u} className="bg-slate-900">{u}</option>)}
              </select>
            </div>
          </header>

          {/* Nav Tabs */}
          <div className="bg-white border-b border-slate-200 px-6 py-3 flex space-x-2">
            {['crm', 'map'].map(tab => (
              <button
                key={tab}
                onClick={() => setActiveTab(tab)}
                className={`px-4 py-2 rounded text-xs font-bold uppercase transition ${activeTab === tab ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
              >
                {tab === 'crm' ? 'Pipeline CRM' : 'Map & Postcodes'}
              </button>
            ))}
          </div>

          {/* Main Body */}
          <main className="max-w-7xl w-full mx-auto p-6 flex-1">
            {activeTab === 'crm' && (
              <div className="space-y-4">
                {/* Filters */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-3">
                  <input
                    type="text"
                    placeholder="Search property or landlord..."
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="px-3 py-2 text-sm border rounded-lg flex-1 min-w-[200px] outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <select value={postcodeFilter} onChange={e => setPostcodeFilter(e.target.value)} className="px-3 py-2 text-sm border rounded-lg bg-white">
                    <option value="All">All Postcodes</option>
                    {postcodes.filter(p => p !== 'All').map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <select value={bedroomFilter} onChange={e => setBedroomFilter(e.target.value)} className="px-3 py-2 text-sm border rounded-lg bg-white">
                    <option value="All">All Bedrooms</option>
                    <option value="1">1 Bed</option>
                    <option value="2">2 Beds</option>
                    <option value="3">3 Beds</option>
                    <option value="4">4+ Beds</option>
                  </select>
                  <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="px-3 py-2 text-sm border rounded-lg bg-white">
                    <option value="All">All Statuses</option>
                    <option value="New Lead">New Lead</option>
                    <option value="Contacted">Contacted</option>
                    <option value="In Negotiation">In Negotiation</option>
                    <option value="Agreement Signed">Agreement Signed</option>
                  </select>
                </div>

                {/* Table */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50 border-b text-xs font-bold text-slate-500 uppercase">
                        <th className="p-4">Property</th>
                        <th className="p-4">Postcode</th>
                        <th className="p-4">Beds</th>
                        <th className="p-4">Rent</th>
                        <th className="p-4">Contact</th>
                        <th className="p-4">Engaged By</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y text-sm">
                      {filteredLeads.map(l => (
                        <tr key={l.id} className="hover:bg-slate-50">
                          <td className="p-4 font-medium">{l.title}</td>
                          <td className="p-4 font-bold text-indigo-600">{l.postcode}</td>
                          <td className="p-4">{l.bedrooms} Bed</td>
                          <td className="p-4 font-bold">£{l.price}</td>
                          <td className="p-4">{l.contactName}</td>
                          <td className="p-4 text-xs font-semibold text-slate-600">{l.engagedBy}</td>
                          <td className="p-4">
                            <select
                              value={l.status}
                              onChange={e => updateStatus(l.id, e.target.value)}
                              className="text-xs px-2 py-1 border rounded bg-white font-medium"
                            >
                              <option value="New Lead">New Lead</option>
                              <option value="Contacted">Contacted</option>
                              <option value="In Negotiation">In Negotiation</option>
                              <option value="Agreement Signed">Agreement Signed</option>
                            </select>
                          </td>
                          <td className="p-4 text-right">
                            <button
                              onClick={() => setSelectedLead(l)}
                              className="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded hover:bg-indigo-100"
                            >
                              Details
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'map' && (
              <div className="bg-white p-6 rounded-xl border shadow-sm">
                <h2 className="text-lg font-bold mb-4">Postcode Cluster Visualizer</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {postcodes.filter(p => p !== 'All').map(pc => {
                    const list = leads.filter(l => l.postcode === pc);
                    return (
                      <div key={pc} className="bg-slate-50 p-4 rounded-lg border">
                        <span className="text-base font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">{pc}</span>
                        <p className="text-xs text-slate-500 mt-2">{list.length} Properties in this area</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Drawer */}
          {selectedLead && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 flex justify-end">
              <div className="w-full max-w-md bg-white h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 className="font-bold text-base">{selectedLead.title}</h3>
                    <button onClick={() => setSelectedLead(null)} className="font-bold text-slate-400 hover:text-slate-600">✕</button>
                  </div>
                  <div className="space-y-3 text-xs">
                    <p><b>Postcode:</b> {selectedLead.postcode}</p>
                    <p><b>Rent:</b> £{selectedLead.price}/mo</p>
                    <p><b>Contact:</b> {selectedLead.contactName} ({selectedLead.phone})</p>
                    <p><b>Last Engaged By:</b> <span className="text-indigo-600 font-bold">{selectedLead.engagedBy}</span></p>
                    
                    <div className="border-t pt-3">
                      <b className="block mb-2">History & Notes:</b>
                      <div className="bg-slate-50 p-3 rounded border max-h-32 overflow-y-auto space-y-2">
                        {selectedLead.history.map((h, i) => (
                          <div key={i} className="border-b pb-1">
                            <span className="text-[10px] text-slate-400">{h.date}</span>
                            <p className="text-xs">{h.text}</p>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex space-x-2 mt-3">
                      <input
                        type="text"
                        placeholder="Add note..."
                        value={newNote}
                        onChange={e => setNewNote(e.target.value)}
                        className="flex-1 px-3 py-1.5 border rounded text-xs outline-none"
                      />
                      <button onClick={addNote} className="px-3 py-1.5 bg-indigo-600 text-white rounded font-bold">Add</button>
                    </div>
                  </div>
                </div>
                <button onClick={() => setSelectedLead(null)} className="mt-4 py-2 bg-slate-100 rounded text-xs font-bold">Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
